<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>事件记录 - AI方工作室</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--primary:#3498db;--dark-bg:#0a2647;--darker-bg:#051b33;--card-bg:rgba(30,80,140,.7);--text:#e6f1ff;--text-secondary:#a3c4e8;--success:#00ff9d;--danger:#e74c3c}
    body{background:linear-gradient(135deg,var(--darker-bg) 0%,var(--dark-bg) 100%);color:var(--text);min-height:100vh;margin:0;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
    .container{max-width:1200px;margin:2rem auto;padding:0 1rem}
    h2{display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem}
    .event-table{width:100%;border-collapse:collapse;background:var(--card-bg);border-radius:12px;overflow:hidden}
    .event-table th,.event-table td{padding:1rem;text-align:left}
    .event-table th{background:rgba(0,0,0,.3);font-weight:600}
    .event-table tr:nth-child(even){background:rgba(255,255,255,.05)}
    .badge{padding:.25rem .7rem;border-radius:20px;font-size:.75rem;font-weight:500}
    .badge-1{background:rgba(0,255,157,.15);color:var(--success)}
    .badge-2{background:rgba(231,76,60,.15);color:var(--danger)}
    .badge-3{background:rgba(243,156,18,.15);color:var(--warning)}
    .pagination{display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:2rem}
    .pagination button{padding:.5rem 1rem;border-radius:6px;background:rgba(52,152,219,.1);color:var(--text);border:1px solid rgba(52,152,219,.3);cursor:pointer;transition:all .3s ease}
    .pagination button:hover{background:rgba(52,152,219,.3)}
    .pagination button:disabled{opacity:.5;cursor:not-allowed}
    .back-btn{
      display:inline-flex;align-items:center;gap:.5rem;
      padding:.6rem 1.2rem;border-radius:8px;
      background:rgba(52,152,219,.15);color:var(--text);
      border:1px solid rgba(52,152,219,.3);
      text-decoration:none;transition:all .3s ease;
    }
.back-btn:hover{background:rgba(52,152,219,.3);}
  </style>
</head>
<body>
<div class="container">
    <div style="margin-bottom:1rem;">
      <a href="/" class="back-btn">
        <i class="fas fa-arrow-left"></i> 返回监控中心
      </a>
    </div>
  <h2><i class="fas fa-history"></i> AI分析事件记录</h2>
  <table class="event-table">
    <thead>
      <tr><th>时间</th><th>小车端口</th><th>结果</th><th>描述</th></tr>
    </thead>
    <tbody id="eventBody"></tbody>
  </table>
  <div class="pagination" id="pagination"></div>
</div>

<script>
const PAGE_SIZE = 15;
let curPage = 1, totalPage = 1;

async function loadEvents(page = 1){
  const res = await fetch(`/event_list?page=${page}&pageSize=${PAGE_SIZE}`).then(r => r.json());
  const logs = res.list || [];
  totalPage = Math.max(1, Math.ceil((res.total || 0) / PAGE_SIZE));
  renderTable(logs);
  renderPagination();
}
function renderTable(logs){
  const tbody = document.getElementById('eventBody');
  tbody.innerHTML = logs.map(e => `
    <tr>
      <td>${e.time}</td>
      <td>${e.port}</td>
      <td><span class="badge badge-${e.result}">${e.result}</span></td>
      <td>${e.desc}</td>
      <td style="color:var(--text-secondary);font-size:0.85em;white-space: pre-wrap;">${e.raw || ''}</td>
    </tr>
  `).join('');
}
function renderPagination(){
  const pg = document.getElementById('pagination');
  pg.innerHTML = `
    <button ${curPage === 1 ? 'disabled' : ''} onclick="loadEvents(curPage - 1)">上一页</button>
    <span>第 ${curPage} / ${totalPage} 页</span>
    <button ${curPage === totalPage ? 'disabled' : ''} onclick="loadEvents(curPage + 1)">下一页</button>
  `;
  if (curPage !== 1) curPage = Math.min(curPage, totalPage);
}
// 初始加载
loadEvents(curPage);
// 每 5 秒自动刷新
setInterval(() => loadEvents(curPage), 5000);
</script>
</body>
</html>
